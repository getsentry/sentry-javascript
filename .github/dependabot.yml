version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    commit-message:
      prefix: ci
      prefix-development: ci
      include: scope
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    ignore:
      - dependency-name: 'typescript'
      # Keep react-router dev dependencies on v7, so tests cover the older major.
      - dependency-name: 'react-router'
        update-types: ['version-update:semver-major']
      - dependency-name: '@react-router/*'
        update-types: ['version-update:semver-major']
      # These are also peer dependencies. The `increase` strategy raises the peer range too,
      # which drops support for older versions (a breaking change).
      - dependency-name: '@tanstack/vue-router'
      - dependency-name: '@tanstack/solid-router'
      - dependency-name: 'solid-js'
      - dependency-name: 'elysia'
      # Keep node-integration-tests on langchain v0. The v1 suite installs v1 via additionalDependencies.
      - dependency-name: 'langchain'
        update-types: ['version-update:semver-major']
      - dependency-name: '@langchain/*'
        update-types: ['version-update:semver-major']
    groups:
      aws-sdk:
        patterns:
          - '@aws-sdk/*'
      opentelemetry:
        patterns:
          - '@opentelemetry/*'
      remix:
        patterns:
          - '@remix-run/*'
      react-router:
        patterns:
          - 'react-router'
          - '@react-router/*'
      langchain:
        patterns:
          - 'langchain'
          - '@langchain/*'
    versioning-strategy: increase
    commit-message:
      prefix: feat
      prefix-development: chore
      include: scope
    exclude-paths:
      - 'dev-packages/e2e-tests/test-applications/**'
