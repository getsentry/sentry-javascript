version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    commit-message:
      prefix: ci
      prefix-development: ci
      include: scope
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    ignore:
      - dependency-name: 'typescript'
      # Keep framework and compiler majors intentional to preserve compatibility coverage.
      - dependency-name: '@angular/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@angular-devkit/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'ng-packagr'
        update-types: ['version-update:semver-major']
      - dependency-name: 'astro'
        update-types: ['version-update:semver-major']
      - dependency-name: 'ember-source'
        update-types: ['version-update:semver-major']
      - dependency-name: 'next'
        update-types: ['version-update:semver-major']
      - dependency-name: 'nuxt'
        update-types: ['version-update:semver-major']
      - dependency-name: '@nuxt/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/express'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-router'
        update-types: ['version-update:semver-major']
      - dependency-name: '@react-router/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@remix-run/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'solid-js'
        update-types: ['version-update:semver-major']
      - dependency-name: '@solidjs/router'
        update-types: ['version-update:semver-major']
      - dependency-name: '@solidjs/start'
        update-types: ['version-update:semver-major']
      - dependency-name: '@tanstack/*-router'
        update-types: ['version-update:semver-major']
      - dependency-name: 'svelte'
        update-types: ['version-update:semver-major']
      - dependency-name: '@sveltejs/kit'
        update-types: ['version-update:semver-major']
      - dependency-name: '@sveltejs/vite-plugin-svelte'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vue'
        update-types: ['version-update:semver-major']
      - dependency-name: '@nestjs/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'express'
        update-types: ['version-update:semver-major']
      - dependency-name: 'fastify'
        update-types: ['version-update:semver-major']
      - dependency-name: 'koa'
        update-types: ['version-update:semver-major']
      - dependency-name: '@koa/router'
        update-types: ['version-update:semver-major']
      - dependency-name: '@hapi/hapi'
        update-types: ['version-update:semver-major']
      - dependency-name: 'hono'
        update-types: ['version-update:semver-major']
      - dependency-name: '@hono/node-server'
        update-types: ['version-update:semver-major']
      - dependency-name: 'elysia'
        update-types: ['version-update:semver-major']
      - dependency-name: 'nitro'
        update-types: ['version-update:semver-major']
      - dependency-name: 'nitropack'
        update-types: ['version-update:semver-major']
      - dependency-name: 'h3'
        update-types: ['version-update:semver-major']
      - dependency-name: 'nuxi'
        update-types: ['version-update:semver-major']
      - dependency-name: 'srvx'
        update-types: ['version-update:semver-major']
      - dependency-name: '@apollo/server'
        update-types: ['version-update:semver-major']
      - dependency-name: 'graphql'
        update-types: ['version-update:semver-major']
    groups:
      opentelemetry:
        patterns:
          - '@opentelemetry/*'
      remix:
        patterns:
          - '@remix-run/*'
      react-router:
        patterns:
          - 'react-router'
          - '@react-router/*'
    versioning-strategy: increase
    commit-message:
      prefix: feat
      prefix-development: chore
      include: scope
    exclude-paths:
      - 'dev-packages/e2e-tests/test-applications/**'
