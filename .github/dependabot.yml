version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    commit-message:
      prefix: ci
      prefix-development: ci
      include: scope
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
    ignore:
      - dependency-name: 'typescript'
      # Keep shared Prisma dependencies on v6; v7 has a dedicated integration suite.
      - dependency-name: 'prisma'
        update-types: ['version-update:semver-major']
      - dependency-name: '@prisma/client'
        update-types: ['version-update:semver-major']
      # Major upgrades of SDK targets and coupled tooling require an explicit compatibility decision.
      - dependency-name: '@angular/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@angular-devkit/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'ng-packagr'
        update-types: ['version-update:semver-major']
      - dependency-name: 'astro'
        update-types: ['version-update:semver-major']
      - dependency-name: 'ember-source'
        update-types: ['version-update:semver-major']
      - dependency-name: 'effect'
        update-types: ['version-update:semver-major']
      - dependency-name: 'next'
        update-types: ['version-update:semver-major']
      - dependency-name: 'nuxt'
        update-types: ['version-update:semver-major']
      - dependency-name: '@nuxt/kit'
        update-types: ['version-update:semver-major']
      - dependency-name: '@nuxt/schema'
        update-types: ['version-update:semver-major']
      - dependency-name: '@nuxt/nitro-server'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/express'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-router'
        update-types: ['version-update:semver-major']
      - dependency-name: '@react-router/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@remix-run/node'
        update-types: ['version-update:semver-major']
      - dependency-name: '@remix-run/react'
        update-types: ['version-update:semver-major']
      - dependency-name: '@remix-run/server-runtime'
        update-types: ['version-update:semver-major']
      - dependency-name: '@remix-run/router'
        update-types: ['version-update:semver-major']
      - dependency-name: '@solidjs/router'
        update-types: ['version-update:semver-major']
      - dependency-name: '@solidjs/start'
        update-types: ['version-update:semver-major']
      - dependency-name: 'svelte'
        update-types: ['version-update:semver-major']
      - dependency-name: '@sveltejs/kit'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vue'
        update-types: ['version-update:semver-major']
      - dependency-name: '@nestjs/common'
        update-types: ['version-update:semver-major']
      - dependency-name: '@nestjs/core'
        update-types: ['version-update:semver-major']
      - dependency-name: 'hono'
        update-types: ['version-update:semver-major']
      - dependency-name: 'nitro'
        update-types: ['version-update:semver-major']
      - dependency-name: 'nitropack'
        update-types: ['version-update:semver-major']
      - dependency-name: 'h3'
        update-types: ['version-update:semver-major']
      - dependency-name: '@cloudflare/workers-types'
        update-types: ['version-update:semver-major']
      - dependency-name: 'wrangler'
        update-types: ['version-update:semver-major']
      - dependency-name: 'bun-types'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: '@edge-runtime/types'
        update-types: ['version-update:semver-major']
      - dependency-name: '@opentelemetry/api'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vite'
        update-types: ['version-update:semver-major']
      - dependency-name: 'webpack'
        update-types: ['version-update:semver-major']
      # These are also peer dependencies. The `increase` strategy raises the peer range too,
      # which drops support for older versions (a breaking change).
      - dependency-name: '@tanstack/vue-router'
      - dependency-name: '@tanstack/solid-router'
      - dependency-name: 'solid-js'
      - dependency-name: 'elysia'
      # node-integration-tests pins langchain v0 to test the lowest supported versions.
      # Dependabot uses one version per workspace, so it would also change the v1 pins in cloudflare-integration-tests.
      - dependency-name: 'langchain'
      - dependency-name: '@langchain/*'
    groups:
      dependencies:
        patterns:
          - '*'
    versioning-strategy: increase
    commit-message:
      prefix: feat
      prefix-development: chore
      include: scope
    exclude-paths:
      - 'dev-packages/bun-integration-tests/**'
      - 'dev-packages/node-integration-tests/**'
      - 'dev-packages/deno-integration-tests/**'
      - 'dev-packages/cloudflare-integration-tests/**'
      - 'dev-packages/e2e-tests/test-applications/**'
