version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    commit-message:
      prefix: ci
      prefix-development: ci
      include: scope
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    ignore:
      - dependency-name: 'typescript'
      # Keep react-router dev dependencies on v7, so tests cover the older major.
      - dependency-name: 'react-router'
        update-types: ['version-update:semver-major']
      - dependency-name: '@react-router/*'
        update-types: ['version-update:semver-major']
    groups:
      opentelemetry:
        patterns:
          - '@opentelemetry/*'
      remix:
        patterns:
          - '@remix-run/*'
      react-router:
        patterns:
          - 'react-router'
          - '@react-router/*'
    versioning-strategy: increase
    commit-message:
      prefix: feat
      prefix-development: chore
      include: scope
    exclude-paths:
      - 'dev-packages/e2e-tests/test-applications/**'
