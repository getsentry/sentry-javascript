version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    commit-message:
      prefix: ci
      prefix-development: ci
      include: scope
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    ignore:
      - dependency-name: '@opentelemetry/instrumentation'
      - dependency-name: '@opentelemetry/instrumentation-*'
      - dependency-name: 'typescript'
      # 2.110.0 raised the engine requirement to Node >=22, while this repo runs Node 20.
      - dependency-name: '@supabase/supabase-js'
        versions: ['>=2.110.0']
    groups:
      opentelemetry:
        patterns:
          - '@opentelemetry/*'
      remix:
        patterns:
          - '@remix-run/*'
      react-router:
        patterns:
          - 'react-router'
          - 'react-router-dom'
          - '@react-router/*'
    versioning-strategy: increase
    commit-message:
      prefix: feat
      prefix-development: chore
      include: scope
    exclude-paths:
      - 'dev-packages/e2e-tests/test-applications/**'
