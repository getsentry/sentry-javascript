name: 'Dependabot: Push deduped lockfile'

# Pushes the lockfile from `dependabot-dedupe.yml` to the Dependabot PR branch.
#
# This workflow holds the Gitflow app token, so it never runs code from the PR. Everything it
# receives is untrusted: anyone with write access can push to a Dependabot branch, and the run that
# produced the artifact used the PR's version of `dependabot-dedupe.yml`. So it looks the PR up
# through the API, accepts only a single regular `pnpm-lock.yaml` file and commits nothing else.

on:
  workflow_run:
    workflows: ['Dependabot: Dedupe lockfile']
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: dependabot-dedupe-push-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  push:
    name: Push deduped lockfile
    if: |
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: namespace-profile-sentry-javascript-small
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Find artifact and Dependabot PR
        id: pr
        run: |
          artifacts=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
            --jq '[.artifacts[] | select(.name == "pnpm-lock")] | length')
          if [ "$artifacts" != "1" ]; then
            echo "No deduped lockfile to push."
            exit 0
          fi

          head_ref=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls" |
            jq -r --arg repo "$GITHUB_REPOSITORY" --arg sha "$HEAD_SHA" '
              [.[] | select(.state == "open"
                and .base.ref == "develop"
                and .user.login == "dependabot[bot]"
                and .head.repo.full_name == $repo
                and .head.sha == $sha)]
              | if length == 1 then .[0].head.ref else empty end')
          if [[ ! "$head_ref" =~ ^dependabot/[A-Za-z0-9._/@+-]+$ ]]; then
            echo "::error::No open Dependabot PR into develop has head commit ${HEAD_SHA}."
            exit 1
          fi
          echo "head_ref=${head_ref}" >> "$GITHUB_OUTPUT"

      - name: Download deduped lockfile
        if: steps.pr.outputs.head_ref
        uses: actions/download-artifact@v8
        with:
          name: pnpm-lock
          path: ${{ runner.temp }}/pnpm-lock
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Check out PR branch
        if: steps.pr.outputs.head_ref
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      # Replace the file instead of writing through it, so a symlinked lockfile in the PR cannot redirect the write.
      - name: Apply deduped lockfile
        if: steps.pr.outputs.head_ref
        id: apply
        env:
          LOCKFILE_DIR: ${{ runner.temp }}/pnpm-lock
        run: |
          if [ "$(find "$LOCKFILE_DIR" -mindepth 1 | wc -l)" != "1" ] || [ ! -f "$LOCKFILE_DIR/pnpm-lock.yaml" ] || [ -L "$LOCKFILE_DIR/pnpm-lock.yaml" ]; then
            echo "::error::The artifact must contain exactly one regular file named pnpm-lock.yaml."
            exit 1
          fi
          if [ "$(git ls-files --stage -- pnpm-lock.yaml | cut -d' ' -f1)" != "100644" ]; then
            echo "::error::pnpm-lock.yaml in the PR is not a regular file."
            exit 1
          fi
          rm pnpm-lock.yaml
          cp "$LOCKFILE_DIR/pnpm-lock.yaml" pnpm-lock.yaml

          changes=$(git status --porcelain)
          if [ -z "$changes" ]; then
            echo "Lockfile is already deduped."
            exit 0
          fi
          if [ "$changes" != " M pnpm-lock.yaml" ]; then
            echo "::error::Unexpected changes:"
            echo "$changes"
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # An app token is needed so the push triggers CI again; pushes made with GITHUB_TOKEN do not.
      - name: Generate GitHub App token
        if: steps.apply.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ vars.GITFLOW_APP_ID }}
          private-key: ${{ secrets.GITFLOW_APP_PRIVATE_KEY }}
          permission-contents: write

      # `[dependabot skip]` lets Dependabot keep rebasing the PR over this commit.
      # The push is not forced, so it fails if the branch moved past HEAD_SHA in the meantime.
      - name: Commit and push
        if: steps.apply.outputs.changed == 'true'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git commit -m "chore(deps): Dedupe pnpm-lock.yaml [dependabot skip]" -- pnpm-lock.yaml
          git push "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${HEAD_REF}"
