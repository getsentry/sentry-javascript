name: 'Dependabot: Dedupe lockfile'

# Dependabot updates pnpm-lock.yaml without deduping it, so `Check lockfile` (`pnpm dedupe --check`)
# fails on most of its PRs. This job dedupes the lockfile and uploads it as an artifact. It runs on
# `pull_request`, so it has no secrets, a read-only token and PR-scoped caches.
# `dependabot-dedupe-push.yml` validates the result and pushes it to the PR branch.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - develop
    paths:
      - 'pnpm-lock.yaml'

permissions:
  contents: read

concurrency:
  group: dependabot-dedupe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dedupe:
    name: Dedupe lockfile
    if: |
      github.event.pull_request.user.login == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    # PR code runs here, so keep its cache writes away from the cache used by develop, like the PR jobs in build.yml.
    runs-on: namespace-profile-sentry-javascript;overrides.cache-tag=sentry-javascript-pr
    # `pnpm dedupe` fetches metadata for every package from npm.
    timeout-minutes: 20
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: ./.github/actions/install-pnpm

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'

      - name: Dedupe lockfile
        id: dedupe
        run: |
          pnpm dedupe --ignore-scripts --ignore-pnpmfile
          git diff --quiet pnpm-lock.yaml || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload deduped lockfile
        if: steps.dedupe.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: pnpm-lock
          path: pnpm-lock.yaml
          retention-days: 1
