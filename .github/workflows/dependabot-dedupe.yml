name: 'Dependabot: Dedupe lockfile'

# Dependabot updates pnpm-lock.yaml without deduping it, so `Check lockfile` (`pnpm dedupe --check`)
# fails on most of its PRs. This pushes a `pnpm dedupe` commit onto the PR branch instead.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - develop
    paths:
      - 'pnpm-lock.yaml'

permissions:
  contents: read

concurrency:
  group: dependabot-dedupe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dedupe:
    name: Dedupe lockfile
    if: |
      github.event.pull_request.user.login == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: namespace-profile-sentry-javascript
    # `pnpm dedupe` fetches metadata for every package from npm.
    timeout-minutes: 20
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      - name: Install pnpm
        uses: ./.github/actions/install-pnpm

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'

      # This job runs with access to secrets, so install scripts from the updated dependencies must not run.
      - name: Dedupe lockfile
        id: diff
        run: |
          pnpm dedupe --ignore-scripts
          git diff --quiet pnpm-lock.yaml || echo "changed=true" >> "$GITHUB_OUTPUT"

      # An app token is needed so the push triggers CI again; pushes made with GITHUB_TOKEN do not.
      - name: Generate GitHub App token
        if: steps.diff.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GITFLOW_APP_ID }}
          private-key: ${{ secrets.GITFLOW_APP_PRIVATE_KEY }}

      # `[dependabot skip]` lets Dependabot keep rebasing the PR over this commit.
      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(deps): Dedupe pnpm-lock.yaml [dependabot skip]"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${HEAD_REF}"
