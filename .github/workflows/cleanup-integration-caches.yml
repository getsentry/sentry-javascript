name: 'Automation: Cleanup integration dependency caches'

on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete integration caches from earlier days
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          today=$(date -u +%F)
          # Finish pagination before deleting entries so pages cannot shift underneath us.
          gh api --paginate "repos/$GH_REPO/actions/caches?key=integration-fixtures-&per_page=100" \
            --jq '.actions_caches[] | [.id, .key] | @tsv' > "$RUNNER_TEMP/integration-caches.tsv"

          while IFS=$'\t' read -r id key; do
            if [[ "$key" == integration-fixtures-* && "$key" =~ -([0-9]{4}-[0-9]{2}-[0-9]{2})$ ]]; then
              if [[ "${BASH_REMATCH[1]}" < "$today" ]]; then
                echo "Deleting $key ($id)"
                if ! response=$(gh api --method DELETE "repos/$GH_REPO/actions/caches/$id" --include --silent 2>&1); then
                  if [[ "$response" =~ HTTP/[0-9.]+[[:space:]]404[[:space:]] ]]; then
                    echo "Cache $id was already deleted; continuing"
                  else
                    printf '%s\n' "$response" >&2
                    exit 1
                  fi
                fi
              fi
            fi
          done < "$RUNNER_TEMP/integration-caches.tsv"
