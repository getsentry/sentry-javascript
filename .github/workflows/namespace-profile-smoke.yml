name: 'CI: Namespace profile smoke test'
on:
  pull_request:
    paths:
      - '.github/**'
  workflow_dispatch:

jobs:
  profiles:
    name: Namespace ${{ matrix.size }} profile
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - size: profile-override
            runner: namespace-profile-sentry-javascript-small;overrides.cache-tag=benchmark-sentry-js-ns-policy-profile-v1
            cores: 2
          - size: unrestricted
            runner:
              - nscloud-ubuntu-24.04-amd64-2x4-with-cache
              - nscloud-cache-tag-benchmark-sentry-js-ns-policy-unrestricted-v1
              - nscloud-cache-size-50gb
            cores: 2
          - size: allowed-branch
            runner:
              - nscloud-ubuntu-24.04-amd64-2x4-with-cache
              - nscloud-cache-tag-benchmark-sentry-js-ns-policy-allowed-v1
              - nscloud-cache-size-50gb
              - nscloud-cache-allow-commit-from-feat/namespace-cache-probe
            cores: 2
    steps:
      - uses: actions/checkout@v7
      - name: Check runner hardware and image
        env:
          EXPECTED_CORES: ${{ matrix.cores }}
        run: |
          uname -m
          cat /etc/os-release
          lscpu | head -25
          free -h
          test "$(nproc)" -eq "$EXPECTED_CORES"
          . /etc/os-release
          test "$VERSION_ID" = 24.04
      - name: Mount smoke-test cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          path: ~/.cache/namespace-benchmark-probe
      - name: Check persistent cache state
        run: |
          probe="$HOME/.cache/namespace-benchmark-probe/marker"
          if test -f "$probe"; then
            echo 'Smoke-test cache restored'
            cat "$probe"
          else
            echo 'Smoke-test cache is empty'
          fi
          echo "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" > "$probe"
          findmnt -T "$probe"
      - name: Inspect cache command options
        run: |
          /nsc/powertoys/spacectl cache mount --help
          if command -v nsc >/dev/null; then
            nsc describe "${RUNNER_NAME#nsc-runner-}" -o json > "$RUNNER_TEMP/namespace-instance.json"
            jq 'paths(scalars) as $p | ($p | map(tostring) | join(".")) as $name |
              select($name | test("cache|volume|branch|commit"; "i")) |
              select($name | test("token|auth|secret|credential|key|url"; "i") | not) |
              {path: $name, value: getpath($p)}' "$RUNNER_TEMP/namespace-instance.json"
          fi

  dependencies:
    name: Validate mounted monorepo dependencies
    runs-on: namespace-profile-sentry-javascript-large;overrides.cache-tag=benchmark-sentry-js-ns-smoke-v2-monorepo-x64
    timeout-minutes: 5
    env:
      CI_BENCHMARK_PROVIDER: namespace
      CI_BENCHMARK_CACHE_PREFIX: benchmark-sentry-js-ns-smoke-v2-
      pnpm_config_verify_deps_before_run: 'false'
      SKIP_PLAYWRIGHT_BROWSER_INSTALL: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/install-dependencies
      - name: Check native modules and bin shims
        run: |
          pnpm exec nx --version
          node --input-type=module -e "await import('rolldown'); console.log('Native Rolldown loaded')"
