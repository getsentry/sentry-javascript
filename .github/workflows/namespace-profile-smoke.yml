name: 'CI: Namespace profile smoke test'
on:
  pull_request:
    paths:
      - '.github/**'
  workflow_dispatch:

jobs:
  profiles:
    name: Namespace ${{ matrix.size }} profile
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - size: small
            runner: namespace-profile-sentry-javascript-small;overrides.cache-tag=benchmark-ns-profile-smoke-v1-small
            cores: 2
          - size: medium
            runner: namespace-profile-sentry-javascript;overrides.cache-tag=benchmark-ns-profile-smoke-v1-medium
            cores: 4
          - size: large
            runner: namespace-profile-sentry-javascript-large;overrides.cache-tag=benchmark-ns-profile-smoke-v1-large
            cores: 8
          - size: explicit-labels
            runner:
              - nscloud-ubuntu-24.04-amd64-2x4-with-cache
              - nscloud-cache-tag-benchmark-sentry-js-ns-explicit-smoke-v1
              - nscloud-cache-size-50gb
              - nscloud-cache-allow-commit-from-feat/namespace-ci-smoke
            cores: 2
    steps:
      - uses: actions/checkout@v7
      - name: Check runner hardware and image
        env:
          EXPECTED_CORES: ${{ matrix.cores }}
        run: |
          uname -m
          cat /etc/os-release
          lscpu | head -25
          free -h
          test "$(nproc)" -eq "$EXPECTED_CORES"
          . /etc/os-release
          test "$VERSION_ID" = 24.04
      - name: Mount smoke-test cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          path: ~/.cache/namespace-benchmark-probe
      - name: Check persistent cache state
        run: |
          probe="$HOME/.cache/namespace-benchmark-probe/marker"
          if test -f "$probe"; then
            echo 'Smoke-test cache restored'
            cat "$probe"
          else
            echo 'Smoke-test cache is empty'
          fi
          echo "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" > "$probe"
          findmnt -T "$probe"
      - name: Inspect cache command options
        run: |
          /nsc/powertoys/spacectl cache --help
          if command -v nsc >/dev/null; then
            nsc describe --help
          fi
