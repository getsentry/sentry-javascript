name: 'CI: Weekly flaky tests'

on:
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/weekly-flaky-tests.yml'
      - 'scripts/weekly-flaky-tests*'
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'
      timezone: 'Europe/Vienna'

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  report:
    name: Weekly flaky test report
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Analyze the last seven days of develop CI
        uses: actions/github-script@v9
        with:
          retries: 3
          script: |
            const { default: run } = await import(
              `${process.env.GITHUB_WORKSPACE}/scripts/weekly-flaky-tests.mjs`
            );
            await run({ github, context, core });
