name: 'Install pnpm'
description: 'Installs the pnpm version from the root devDependencies.'

runs:
  using: 'composite'
  steps:
    # The dev dependency is the one pnpm version for CI and local runs. An app that needs another version sets
    # `packageManager` in its package.json, and pnpm switches to that version. It is read from package.json rather
    # than node_modules, so jobs that don't restore the monorepo's dependencies can use it.
    - name: Resolve pnpm version
      id: pnpm-version
      shell: bash
      run: echo "version=$(jq -er '.devDependencies.pnpm' "$GITHUB_WORKSPACE/package.json")" >> "$GITHUB_OUTPUT"
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: ${{ steps.pnpm-version.outputs.version }}
