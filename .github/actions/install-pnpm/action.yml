name: 'Install pnpm'
description: 'Installs the pnpm version of `packageManager` in the root package.json.'

runs:
  using: 'composite'
  steps:
    # Without a `version` input, the action reads the version from `packageManager`. With both, it fails.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
