name: 'Install pnpm'
description: 'Installs the pnpm version that Volta pins for a package.'
inputs:
  package-json:
    description: 'The package.json to read `volta.pnpm` from. `volta.extends` is followed until a version is found.'
    default: 'package.json'

runs:
  using: 'composite'
  steps:
    - name: Resolve pnpm version
      id: pnpm-version
      shell: bash
      env:
        PACKAGE_JSON: ${{ inputs.package-json }}
      # Keep in sync with `getPnpmMajor` in `dev-packages/e2e-tests/lib/pnpmOverrides.ts`. It writes the overrides in
      # the format of the version it finds, so a different lookup breaks the install.
      run: |
        package_json="$PACKAGE_JSON"
        until version=$(jq -er '.volta.pnpm' "$package_json"); do
          extends=$(jq -er '.volta.extends' "$package_json") || {
            echo "::error::No volta.pnpm in $PACKAGE_JSON or the files it extends"
            exit 1
          }
          package_json="$(dirname "$package_json")/$extends"
        done
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: ${{ steps.pnpm-version.outputs.version }}
