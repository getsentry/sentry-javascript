name: 'Install Playwright dependencies'
description: 'Installs Playwright browsers and system dependencies, keeping both on the Namespace cache volume.'
inputs:
  browsers:
    description: 'What browsers to install.'
    default: 'chromium webkit firefox'
  cwd:
    description: 'The working directory to run Playwright in.'
    default: '.'
  installed-version:
    description:
      'A Playwright version that an earlier run of this action already installed. Skips the install if it matches.'
    default: ''

outputs:
  version:
    description: 'The resolved Playwright version, empty if Playwright is not installed or the install was skipped.'
    value: ${{ steps.playwright-version.outputs.version }}

runs:
  using: 'composite'
  steps:
    # Resolve the app's @playwright/test version. Some apps (e.g. the node bundler apps) assert via a
    # plain node script and don't depend on Playwright — emit an empty version instead of failing, so
    # the steps below skip the (wasted) browser install rather than erroring on the missing package.
    - name: Get Playwright version
      id: playwright-version
      run: |
        version=$(node -e "let v = ''; try { v = require('@playwright/test/package.json').version; } catch {} process.stdout.write(String(v));")
        if [ "$version" = "$INSTALLED_VERSION" ]; then version=''; fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
      shell: bash
      env:
        INSTALLED_VERSION: ${{ inputs.installed-version }}
      working-directory: ${{ inputs.cwd }}

    - name: Mount Playwright cache
      uses: namespacelabs/nscloud-cache-action@v1.7.0
      if: steps.playwright-version.outputs.version != '' && env.PLAYWRIGHT_CACHE_MOUNTED != 'true'
      with:
        cache: |
          playwright
          apt

    # Downloads only the browsers and apt packages that are not on the cache volume yet
    - name: Install Playwright
      if: steps.playwright-version.outputs.version != ''
      run: |
        echo "PLAYWRIGHT_CACHE_MOUNTED=true" >> "$GITHUB_ENV"
        npx playwright install --with-deps $PLAYWRIGHT_BROWSERS
      env:
        PLAYWRIGHT_BROWSERS: ${{ inputs.browsers || 'chromium webkit firefox' }}
      shell: bash
      working-directory: ${{ inputs.cwd }}
