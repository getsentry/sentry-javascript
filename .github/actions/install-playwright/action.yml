name: 'Install Playwright dependencies'
description: 'Installs Playwright browsers and system dependencies, keeping both on the Namespace cache volume.'
inputs:
  browsers:
    description: 'What browsers to install.'
    default: 'chromium webkit firefox'
  cwd:
    description:
      'The directory whose package.json declares the `@playwright/test` version to install. Nothing is installed if it
      does not depend on `@playwright/test`.'
    required: true

runs:
  using: 'composite'
  steps:
    # Read from package.json rather than node_modules, so this can run before dependencies are installed.
    - name: Get Playwright version
      id: playwright-version
      run: |
        version=$(node -e "
          const { dependencies, devDependencies } = require('./package.json');
          const range = devDependencies?.['@playwright/test'] ?? dependencies?.['@playwright/test'] ?? '';
          process.stdout.write(range.replace(/^[~^=]/, ''));
        ")
        echo "version=$version" >> "$GITHUB_OUTPUT"
      shell: bash
      working-directory: ${{ inputs.cwd }}

    - name: Mount Playwright cache
      uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
      if: steps.playwright-version.outputs.version != ''
      with:
        cache: |
          playwright
          apt

    # `install-deps` names packages that the runner image already has (glib, mesa, nss, ...), and `apt-get install` would
    # upgrade them to the latest Ubuntu update. That is half of the download on a cold cache, and the image versions work.
    - name: Keep installed apt packages
      if: steps.playwright-version.outputs.version != ''
      run: echo 'APT::Get::Upgrade "false";' | sudo tee /etc/apt/apt.conf.d/99-no-upgrade > /dev/null
      shell: bash

    # Downloads only the browsers and apt packages that are not on the cache volume yet. `npx` runs outside the repo,
    # so it can't pick up a `playwright` that a parallel `pnpm install` is still linking.
    # A browser download can crawl for minutes, so an attempt that takes too long is retried. apt is not stopped
    # midway, so it can't leave half-installed packages behind.
    # On the runner image, the only packages `install-deps` installs for Chromium are fonts, and no test compares
    # rendered pixels. On an empty cache volume, their download crawled for up to 10 minutes, so Chromium skips them
    # unless a library is missing. WebKit and Firefox need libraries the image does not have.
    - name: Install Playwright
      if: steps.playwright-version.outputs.version != ''
      env:
        PLAYWRIGHT_BROWSERS: ${{ inputs.browsers || 'chromium webkit firefox' }}
        PLAYWRIGHT_VERSION: ${{ steps.playwright-version.outputs.version }}
      run: |
        read -ra browsers <<< "$PLAYWRIGHT_BROWSERS"
        playwright=(npx -y "playwright@$PLAYWRIGHT_VERSION")
        installed=false
        for attempt in 1 2; do
          if timeout 300 "${playwright[@]}" install "${browsers[@]}"; then
            installed=true
            break
          fi
          echo "::warning::playwright install attempt $attempt failed or did not finish in 300 s, retrying"
        done
        if [[ "$installed" != true ]]; then
          timeout 600 "${playwright[@]}" install "${browsers[@]}"
        fi

        if [[ "${browsers[*]}" == chromium ]]; then
          missing=$(find ~/.cache/ms-playwright -type f \( -name chrome -o -name chrome-headless-shell \) \
            -exec ldd {} + 2> /dev/null | grep 'not found' || true)
          if [[ -z "$missing" ]]; then
            exit 0
          fi
          echo "Chromium is missing libraries, installing its system dependencies:"
          echo "$missing"
        fi
        "${playwright[@]}" install-deps "${browsers[@]}"
      shell: bash
      working-directory: ${{ runner.temp }}
