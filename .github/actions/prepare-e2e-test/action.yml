name: 'Prepare E2E test application'
description:
  'Sets up the runtimes for an E2E test application, restores the built tarballs and copies the application to
  `runner.temp/test-application` with pnpm overrides pointing at the tarballs. For a job that runs one application.'
inputs:
  test-application:
    description: 'The name of the test application in dev-packages/e2e-tests/test-applications.'
    required: true
  runtime:
    description: 'The `runtime` of a runtime variant, see dev-packages/e2e-tests/README.md.'
    default: ''
  deno-version:
    description: 'The Deno version to install, if the application needs Deno.'
    default: 'v2.8.3'
  artifacts-run-id:
    description: 'The workflow run that uploaded the tarball artifacts. Defaults to the current run.'
    default: ''
  github-token:
    description: 'Token to download artifacts from `artifacts-run-id`. Only needed when that is set.'
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Set up E2E tests
      uses: ./.github/actions/setup-e2e-tests
      with:
        aws-serverless-layer: ${{ contains(inputs.test-application, 'aws-serverless') }}
        aws-serverless-build: ${{ inputs.test-application == 'aws-serverless' }}
        artifacts-run-id: ${{ inputs.artifacts-run-id }}
        github-token: ${{ inputs.github-token }}

    - name: Prepare E2E test application
      uses: ./.github/actions/prepare-e2e-app
      with:
        test-application: ${{ inputs.test-application }}
        dir: ${{ runner.temp }}/test-application
        runtime: ${{ inputs.runtime }}
        deno-version: ${{ inputs.deno-version }}
