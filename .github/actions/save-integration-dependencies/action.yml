name: Save integration dependencies
description: Remove incomplete installations and save reusable integration fixture dependencies.

inputs:
  key:
    description: Cache key returned by restore-integration-dependencies
    required: true

runs:
  using: composite
  steps:
    - name: Prune incomplete fixture installs
      id: fixture-cache-prune
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        node <<'NODE' >> "$GITHUB_OUTPUT"
        const fs = require('node:fs');
        const path = require('node:path');
        const root = 'dev-packages/node-integration-tests/.integration-dependency-cache';
        if (!fs.existsSync(root)) {
          console.log('entries=0');
          process.exit(0);
        }
        const keep = new Set();
        for (const file of fs.readdirSync(root).filter(f => f.endsWith('.json'))) {
          try {
            const entry = JSON.parse(fs.readFileSync(path.join(root, file), 'utf8')).directory;
            if (typeof entry !== 'string' || !entry.startsWith('entry_') || path.basename(entry) !== entry) throw Error('Invalid cache entry');
            keep.add(entry);
          } catch {
            fs.rmSync(path.join(root, file), { force: true });
          }
        }
        for (const entry of fs.readdirSync(root)) {
          if ((entry.startsWith('entry_') && !keep.has(entry)) || entry.endsWith('.tmp')) {
            fs.rmSync(path.join(root, entry), { recursive: true, force: true });
          }
        }
        console.log(`entries=${keep.size}`);
        NODE
    - name: Save fixture dependency cache
      if: >-
        !cancelled() && steps.fixture-cache-prune.outputs.entries != '' && steps.fixture-cache-prune.outputs.entries !=
        '0'
      uses: actions/cache/save@v6.1.0
      with:
        path: dev-packages/node-integration-tests/.integration-dependency-cache
        key: ${{ inputs.key }}
