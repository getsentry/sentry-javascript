name: Restore integration dependencies
description: Restore installed integration fixture dependencies for this runtime and shard.

inputs:
  shard:
    description: Integration test shard
    default: all

outputs:
  key:
    description: Cache key for this runtime, shard and UTC day
    value: ${{ steps.fixture-cache-key.outputs.key }}
  cache-hit:
    description: Whether the exact cache key was restored
    value: ${{ steps.fixture-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Compute fixture cache key
      id: fixture-cache-key
      shell: bash
      env:
        FIXTURE_CACHE_SHARD: ${{ inputs.shard }}
        FIXTURE_CACHE_SOURCE_HASH:
          ${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', '.npmrc',
          'dev-packages/node-integration-tests/**/*.ts') }}
      run: |
        node <<'NODE' >> "$GITHUB_OUTPUT"
        const { execFileSync } = require('node:child_process');
        const job = process.env.GITHUB_JOB;
        const runtime = job === 'job_bun_integration_tests'
          ? execFileSync('bun', ['--version'], { encoding: 'utf8' }).trim()
          : job === 'job_deno_integration_tests'
            ? execFileSync('deno', ['--version'], { encoding: 'utf8' }).trim().split(/\s+/)[1]
            : process.versions.node;
        const day = new Date().toISOString().slice(0, 10);
        const key = `integration-fixtures-v2-${process.platform}-${process.arch}-${process.versions.node}-${job}-${process.env.FIXTURE_CACHE_SHARD}-${runtime}-${process.env.FIXTURE_CACHE_SOURCE_HASH}-${day}`;
        if (key.includes(',') || key.length > 512) throw Error(`Invalid fixture cache key: ${key}`);
        console.log(`key=${key}`);
        NODE
    - name: Restore fixture dependency cache
      id: fixture-cache
      uses: actions/cache/restore@v6.1.0
      with:
        path: dev-packages/node-integration-tests/.integration-dependency-cache
        key: ${{ steps.fixture-cache-key.outputs.key }}
