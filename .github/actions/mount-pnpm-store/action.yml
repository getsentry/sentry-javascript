name: 'Mount pnpm store'
description:
  'Mounts the pnpm store, the pnpm and npm caches and the given paths from the Namespace cache volume. Use it before
  `install-pnpm`, so `install-pnpm` takes pnpm from the cache volume.'

inputs:
  path:
    description: 'Paths to mount from the cache volume in addition to the pnpm store and caches, one per line.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    # Replaces the `pnpm` mode of nscloud-cache-action until it works without pnpm on PATH. The mode runs `pnpm store
    # path`, so it only works after `install-pnpm`, when `pnpm self-update` has already downloaded pnpm.
    # The cache directory holds `lockfile-verified.jsonl`. With it, `pnpm install` skips the supply-chain check of a
    # lockfile that was already verified, which otherwise fetches the metadata of every package from the registry.
    - name: Set pnpm store and cache directories
      run: |
        echo "PNPM_CONFIG_STORE_DIR=$HOME/.cache/pnpm-store" >> "$GITHUB_ENV"
        echo "PNPM_CONFIG_CACHE_DIR=$HOME/.cache/pnpm" >> "$GITHUB_ENV"
      shell: bash

    # The `npm` mode keeps the npm cache of the `npm ci` in `pnpm/action-setup`, which installs the bootstrap pnpm
    - name: Mount cache paths
      uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
      with:
        cache: npm
        path: |
          ~/.cache/pnpm-store
          ~/.cache/pnpm
          ${{ inputs.path }}
