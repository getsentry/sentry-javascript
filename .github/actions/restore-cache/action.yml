name: 'Restore dependency & build cache'
description: 'Restore the dependency & build cache.'

inputs:
  dependency_cache_key:
    description: 'The dependency cache key'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Install pnpm
      if: env.CI_BENCHMARK_PROVIDER != 'namespace'
      uses: ./.github/actions/install-pnpm

    - name: Check dependency cache
      id: dep-cache
      if: env.CI_BENCHMARK_PROVIDER != 'namespace'
      uses: actions/cache/restore@v6.1.0
      with:
        path: ${{ env.CACHED_DEPENDENCY_PATHS }}
        key: ${{ env.CI_BENCHMARK_CACHE_PREFIX }}${{ inputs.dependency_cache_key }}-${{ runner.arch }}

    - name: Restore build artifacts
      uses: actions/download-artifact@v7
      with:
        name: build-output

    - name: Install dependencies
      if: env.CI_BENCHMARK_PROVIDER != 'namespace' && steps.dep-cache.outputs.cache-hit != 'true'
      run: pnpm install --frozen-lockfile
      shell: bash

    - name: Install dependencies from Namespace volume
      if: env.CI_BENCHMARK_PROVIDER == 'namespace'
      uses: ./.github/actions/install-namespace-dependencies
