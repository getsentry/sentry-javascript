name: 'Build SDK packages locally'
description: 'Restore workspace dependencies and build the SDK outputs needed by this job.'
inputs:
  additional-targets:
    description: 'Additional Nx targets, such as build:tarball or build:bundle.'
    default: ''
runs:
  using: composite
  steps:
    - name: Set up build Node
      uses: ./.github/actions/setup-node
    - name: Restore workspace dependencies
      uses: ./.github/actions/install-dependencies
    - name: Build SDK packages
      run: pnpm run build:ci
      shell: bash
    - name: Build additional SDK outputs
      if: inputs.additional-targets != ''
      run: pnpm exec nx run-many -t ${{ inputs.additional-targets }} --parallel=4
      shell: bash
