name: 'Build SDK packages locally'
description: 'Restore workspace dependencies and build the SDK outputs needed by this job.'
inputs:
  setup:
    description: 'Set up the build Node version and restore workspace dependencies.'
    default: 'true'
  package-path:
    description: 'Comma-separated package paths whose SDK dependencies to build; use . only for repo-wide checks.'
    default: ''
  targets:
    description: 'Nx targets to build for the selected packages and their dependencies.'
    default: 'build:transpile build:types'
runs:
  using: composite
  steps:
    - name: Set up build Node
      if: inputs.setup == 'true'
      uses: ./.github/actions/setup-node
    - name: Restore workspace dependencies
      if: inputs.setup == 'true'
      uses: ./.github/actions/install-dependencies
    - name: Select SDK packages
      id: projects
      env:
        INPUT_PACKAGE_PATH: ${{ inputs.package-path }}
      run: node "$GITHUB_ACTION_PATH/select-projects.mjs" >> "$GITHUB_OUTPUT"
      shell: bash
    - name: Build SDK packages
      env:
        BUILD_PROJECTS: ${{ steps.projects.outputs.projects }}
      run: |
        node scripts/verify-packages-versions.js
        pnpm exec nx run-many -t ${{ inputs.targets }} --projects="$BUILD_PROJECTS" --parallel=4
      shell: bash
