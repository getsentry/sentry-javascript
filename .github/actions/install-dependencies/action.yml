name: Install pnpm dependencies
description: Installs pnpm dependencies and caches them.
outputs:
  cache_key:
    description: The dependency cache key
    value: ${{ steps.compute_lockfile_hash.outputs.hash }}
runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: ./.github/actions/install-pnpm
    - name: Compute dependency cache key
      id: compute_lockfile_hash
      run: node ./scripts/dependency-hash-key.js >> "$GITHUB_OUTPUT"
      shell: bash
    - name: Compute selected dependency cache key
      id: group
      if: inputs.group != ''
      env:
        DEPENDENCY_GROUP: ${{ inputs.group }}
        DEPENDENCY_HASH: ${{ steps.compute_lockfile_hash.outputs.hash }}
      run: node "$GITHUB_ACTION_PATH/groups.mjs" key "$DEPENDENCY_GROUP" "$DEPENDENCY_HASH" >> "$GITHUB_OUTPUT"
      shell: bash
    - name: Restore selected workspace dependencies
      id: selected
      if: inputs.group != ''
      uses: actions/cache/restore@v6.1.0
      with:
        path: ${{ env.CACHED_DEPENDENCY_PATHS }}
        key: ${{ steps.group.outputs.key }}
    - name: Check dependency cache
      uses: actions/cache@v6.1.0
      id: cache_dependencies
      with:
        path: ${{ env.CACHED_DEPENDENCY_PATHS }}
        key: ${{ steps.compute_lockfile_hash.outputs.hash }}-${{ runner.arch }}
      if: inputs.group == '' || steps.selected.outputs.cache-hit != 'true'
    - name: Install dependencies
      if: steps.selected.outputs.cache-hit != 'true' && steps.cache_dependencies.outputs.cache-hit != 'true'
      run: pnpm install --frozen-lockfile
      shell: bash
inputs:
  group:
    description: Optional dependency group; fall back to the full workspace cache on a miss.
    default: ''
