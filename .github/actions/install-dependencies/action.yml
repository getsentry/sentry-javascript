name: 'Install yarn dependencies'
description: 'Installs yarn dependencies into node_modules folders on the Namespace cache volume.'

runs:
  using: 'composite'
  steps:
    - name: List dependency paths
      id: paths
      run: |
        {
          echo 'paths<<EOF'
          node -e 'const { workspaces } = require("./package.json"); for (const dir of [".", ...workspaces]) console.log(require("path").resolve(dir, "node_modules"))'
          echo '~/.cache/mongodb-binaries'
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Mount dependency cache
      uses: namespacelabs/nscloud-cache-action@v1.7.0
      with:
        cache: yarn
        path: ${{ steps.paths.outputs.paths }}

    # The cache volume can hold node_modules of another commit or branch. This is a no-op when they match yarn.lock.
    - name: Install dependencies
      run: yarn install --ignore-engines --frozen-lockfile
      shell: bash
