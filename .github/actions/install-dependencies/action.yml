name: 'Install pnpm dependencies'
description: 'Installs pnpm dependencies and caches them.'

outputs:
  cache_key:
    description: 'The dependency cache key'
    value: ${{ steps.compute_lockfile_hash.outputs.hash }}

runs:
  using: 'composite'
  steps:
    - name: Install dependencies from Namespace volume
      if: env.CI_BENCHMARK_PROVIDER == 'namespace'
      uses: ./.github/actions/install-namespace-dependencies

    - name: Install pnpm
      if: env.CI_BENCHMARK_PROVIDER != 'namespace'
      uses: ./.github/actions/install-pnpm

    - name: Compute dependency cache key
      id: compute_lockfile_hash
      run: node ./scripts/dependency-hash-key.js >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Check dependency cache
      uses: actions/cache@v6.1.0
      id: cache_dependencies
      if: env.CI_BENCHMARK_PROVIDER != 'namespace'
      with:
        path: ${{ env.CACHED_DEPENDENCY_PATHS }}
        key: ${{ env.CI_BENCHMARK_CACHE_PREFIX }}${{ steps.compute_lockfile_hash.outputs.hash }}-${{ runner.arch }}

    - name: Install dependencies
      if: env.CI_BENCHMARK_PROVIDER != 'namespace' && steps.cache_dependencies.outputs.cache-hit != 'true'
      run: pnpm install --frozen-lockfile
      shell: bash

    - name: Report benchmark dependency cache
      if: env.CI_BENCHMARK_CACHE_PREFIX != '' && env.CI_BENCHMARK_PROVIDER != 'namespace'
      run:
        echo "BENCHMARK_CACHE provider=github kind=workspace-node-modules hit=${{
        steps.cache_dependencies.outputs.cache-hit }}"
      shell: bash
