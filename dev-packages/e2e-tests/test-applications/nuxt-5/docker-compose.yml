services:
  mongo:
    # `mongo:8` floats to the newest 8.x release, whose server sometimes exits right after start on CI.
    image: mongo:8.0
    restart: always
    container_name: e2e-tests-nuxt-5-mongo
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: docker
    healthcheck:
      test: ['CMD-SHELL', 'mongosh --quiet --eval "db.adminCommand(''ping'').ok"']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
