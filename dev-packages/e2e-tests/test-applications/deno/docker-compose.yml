services:
  mysql:
    image: mysql:8.0
    restart: always
    container_name: e2e-tests-deno-mysql
    # The `mysql` 2.x driver doesn't speak MySQL 8's default
    # `caching_sha2_password` auth, so force the legacy plugin.
    command: ['--default-authentication-plugin=mysql_native_password']
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: password
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -ppassword']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

  postgres:
    image: postgres:13
    restart: always
    container_name: e2e-tests-deno-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  redis:
    image: redis:8
    restart: always
    container_name: e2e-tests-deno-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 1s
      timeout: 3s
      retries: 30
