name: 'size-limit-gh-action'
description: 'Run size-limit comparison'
inputs:
  github_token:
    required: true
    description: 'a github access token'
  comparison_branch:
    required: false
    default: ''
    description: 'If set, compare the current branch with this branch'
runs:
  using: 'node24'
  main: 'index.mjs'
