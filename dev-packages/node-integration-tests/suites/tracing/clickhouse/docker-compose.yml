services:
  db:
    image: clickhouse/clickhouse-server:25.8
    restart: always
    ports:
      - '8123:8123'
    environment:
      CLICKHOUSE_DB: tests
      CLICKHOUSE_USER: test
      CLICKHOUSE_PASSWORD: test
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ['CMD-SHELL', 'clickhouse-client --user test --password test --query "SELECT 1"']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
