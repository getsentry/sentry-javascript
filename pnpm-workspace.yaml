# Yarn 1 did not install peer dependencies, and some packages break with the versions that pnpm would add.
autoInstallPeers: false
strictPeerDependencies: false
# The packages depend on each other by exact version, not with `workspace:`.
# This links them from the workspace instead of installing them from npm.
linkWorkspacePackages: true

overrides:
  nx>minimatch: 10.2.5
  postcss-url>minimatch: 3.1.5
  '@angular-devkit/build-angular>minimatch': 5.1.9
  nitropack>rollup-plugin-visualizer: ^6.0.3

# Dependencies that import packages without declaring them. pnpm links these peers to the versions of the importer.
packageExtensions:
  # Its type declarations import the bundler types.
  '@apm-js-collab/code-transformer-bundler-plugins':
    peerDependencies:
      esbuild: '*'
      rollup: '*'
      vite: '*'
      webpack: '*'
    peerDependenciesMeta:
      esbuild:
        optional: true
      rollup:
        optional: true
      vite:
        optional: true
      webpack:
        optional: true

# Dependencies whose install scripts run. pnpm 11+ fails the install on build scripts that are not listed.
# `false` only for scripts that just print a message.
allowBuilds:
  '@apollo/protobufjs': true
  '@nestjs/core': false
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@sentry/node-cpu-profiler': true
  '@sentry/node-native-stacktrace': true
  core-js-pure: false
  esbuild: true
  mongodb-memory-server-global: true
  nice-napi: true
  nx: true
  prisma: true
  sharp: true
  vue-demi: true
  workerd: true
minimumReleaseAgeExclude:
  - '@opentelemetry/api@1.10.0'
